name: Roxy Cloner V2

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (preview only, no changes)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

concurrency:
  # Never let two clones fight over the same rate limit budget.
  group: roxy-cloner
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run check

      - name: Unit tests
        run: npm test

  run-cloner:
    name: Run cloner
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Cloner
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          DC_TOKEN: ${{ secrets.DC_TOKEN }}
          ALLOWED_ID: ${{ secrets.ALLOWED_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run || vars.DRY_RUN || 'false' }}
          CLONE_DELAY_MS: ${{ vars.CLONE_DELAY_MS || '750' }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL || 'info' }}
        # Discord refuses connections from datacenter IPs far more often than
        # from home lines; if login fails, run it locally instead.
        run: node index.js
